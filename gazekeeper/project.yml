name: GazeKeeper
packages:
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    version: 1.18.7
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    version: 2.8.0
options:
  bundleIdPrefix: com.hridya
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
targets:
  GazeKeeper:
    type: application
    platform: macOS
    sources:
      - Sources/App
      - path: Resources
        buildPhase: resources
    dependencies:
      - target: GazeKeeperCore
        embed: true
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hridya.gazekeeper
        PRODUCT_NAME: GazeKeeper
        INFOPLIST_FILE: Support/GazeKeeper-Info.plist
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Sparkle EdDSA public key. The private key lives in the owner's
        # login keychain (generated 2026-10-11 via Sparkle's generate_keys);
        # export it with `generate_keys -x` onto release machines.
        SPARKLE_PUBLIC_ED_KEY: "/clerL87pHPUxzWJ/7jrIEePDyNwCZNFA2qwxekrEVY="
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ENABLE_PREVIEWS: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  GazeKeeperCore:
    type: framework
    platform: macOS
    sources:
      - Sources/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hridya.gazekeeper.core
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        GENERATE_INFOPLIST_FILE: true
  GazeKeeperCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/CoreTests
    dependencies:
      - target: GazeKeeperCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hridya.gazekeeper.coretests
        GENERATE_INFOPLIST_FILE: true
  GazeKeeperAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/AppTests
    dependencies:
      - target: GazeKeeper
      - package: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hridya.gazekeeper.apptests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: GazeKeeper
  GazeKeeperUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/UITests
    dependencies:
      - target: GazeKeeper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hridya.gazekeeper.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: GazeKeeper
schemes:
  GazeKeeper:
    build:
      targets:
        GazeKeeper: all
        GazeKeeperCore: [build]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GazeKeeperCoreTests
        - GazeKeeperAppTests
  GazeKeeper-UI:
    build:
      targets:
        GazeKeeper: all
    test:
      config: Debug
      targets:
        - GazeKeeperUITests
